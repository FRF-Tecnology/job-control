<!doctype html>
<!-- Página fictícia que imita uma vaga com candidatura simplificada em duas etapas. Empresa e vaga inventadas. -->
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Dev Go - Empresa Teste</title></head>
<body>
  <h1>Dev Go</h1>
  <p>Empresa Teste. Trabalho remoto. Dúvidas? Entre em contato com o time. Faça parte do nosso time de dados.</p>
  <button type="button" id="abrir" onclick="document.getElementById('modal').style.display='block'; this.style.display='none'">Candidatura simplificada</button>
  <div id="modal" style="display:none">
    <form id="f" method="post" action="/jobs/view/9000000001/apply" enctype="multipart/form-data">
      <div id="e1">
        <h2>Informações de contato</h2>
        <label for="nome">Nome completo</label><input id="nome" name="nome" required>
        <label for="email">E-mail</label><input id="email" name="email" type="email" required>
        <label for="tel">Telefone celular</label><input id="tel" name="tel" type="tel" required>
        <label for="cv">Currículo (PDF)</label><input id="cv" name="cv" type="file" accept=".pdf" required>
        <button type="button" onclick="document.getElementById('e1').style.display='none'; document.getElementById('e2').style.display='block'">Avançar</button>
      </div>
      <div id="e2" style="display:none">
        <h2>Perguntas adicionais</h2>
        <label for="anos">Anos de experiência com Go</label><input id="anos" name="anos" type="number" required>
        <label for="bd">Experiência com banco de dados?</label>
        <select id="bd" name="bd" required><option value="">Selecione</option><option value="s">Sim</option><option value="n">Não</option></select>
        <fieldset><legend>Disponível para trabalho remoto?</legend>
          <label><input type="radio" name="remoto" value="sim">Sim</label>
          <label><input type="radio" name="remoto" value="nao">Não</label>
        </fieldset>
        <button type="submit">Enviar candidatura</button>
      </div>
    </form>
  </div>
</body>
</html>
